# The phone used for the field test (tools/fieldtest). A test instrument, not a product: it stays out
# of catalog/ and its cost totals. Nominal values from the published specs; the checkerboard
# calibration replaces f/p and distortion per stream size.
phone: Redmi Note 13 Pro

# The phone's stream (an RTSP app on port 1945, or IP Webcam: http://<phone>:8080/video with still and
# sensor endpoints). Put the real URLs, login included, in the git-ignored fieldtest/phone.local.yaml,
# which overrides these placeholders; the tool never prints the password.

stream_url: rtsp://USER:PASS@<phone>:1945/     # placeholder: the real URL goes in phone.local.yaml
still_url: ""
sensors_url: ""

main:                              # Samsung ISOCELL HP3
  sensor: Samsung ISOCELL HP3
  megapixels: 200
  optical_format: 1/1.4"
  native_pitch_um: 0.56
  native_px: [16320, 12240]
  sensor_mm: [9.14, 6.85]
  focal_mm: 6.07                   # physical; 23 mm equivalent (crop factor 3.79)
  focal_equiv_mm: 23
  crop_modes_mm: [28, 35]          # the phone camera app's crops of the middle of the sensor
  aperture: 1.7
  photo_px: [4080, 3060]           # normal 12.5 MP photo (16 pixels combined into 1)

ultrawide:                         # for the distortion test, with distortion correction off
  megapixels: 8
  optical_format: 1/4"
  pitch_um: 1.12
  native_px: [3264, 2448]
  quoted_fov_deg: 118              # probably diagonal: calibration decides
  aperture: 2.2

checkerboard:
  inner_corners: [9, 6]
  square_mm: 36                    # A3 board, 36 mm measured with a ruler
  min_views: 12

presets:                           # field-test setups (design.md D5); rho: required density, px/m
  default: { focal_equiv_mm: 23, frame_px: [1440, 1080], rho: 100, height_m: 1.5 }
  office:  { focal_equiv_mm: 23, frame_px: [4080, 3060], rho: 680, height_m: 0.9 }
  # The phone's RTSP app (port 1945) streams 720p only (1080p and MAX greyed out), all 16:9: no 4:3
  # size, so the lens is calibrated at 1280 × 720 before the overlay (task 1.3).
  rtsp720: { focal_equiv_mm: 23, frame_px: [1280, 720], rho: 100, height_m: 1.5 }
  # The rtsp720 setup shrunk to a 1.8 × 2.5 m office corridor: ρ 380 keeps z_max inside 2.5 m with the
  # calibrated fx (901 px: z_max 2.37 m, S 1.39 m; nominal 850 px: 2.24 m),
  # the phone at 0.45 m keeps the default's view down onto the square (1.5 m over 8.5 m, scaled).
  corridor: { focal_equiv_mm: 23, frame_px: [1280, 720], rho: 380, height_m: 0.45 }

# Pass bands (design.md D6)
pass:
  lens_rms_px: 0.5
  pose_height_m: 0.05
  pose_reproj_px: 2.0
  overlay_pct_of_width: 2.0
  density_pct: 5.0
  density_floor_px: 1.0            # for objects under 20 px
