# Danger-zone pole digital twin: containers joined by virtual cables.
#   docker compose up --build        the v11 pole (hardware list version 11), then open http://localhost:8080
#   docker compose -f compose.yaml -f compose.phase1.yaml up --build     the phase-1 guide's pole
# Solid cables (as on the real pole): poe_lan (Ethernet), wan_4g (4G), and in phase 1 usb_bus
# (USB serial). sim_ctrl is the twin's own control and video-to-dashboard network.
name: twin

services:
  camera:                      # the camera's network endpoint: RTSP for the Orin, HLS for the dashboard
    image: bluenviron/mediamtx:1.21.1
    volumes: [./camera/mediamtx.yml:/mediamtx.yml:ro]
    networks:
      poe_lan: { ipv4_address: 192.168.10.20 }
      sim_ctrl: { ipv4_address: 172.29.10.20 }
    restart: unless-stopped

  world:                       # renders the camera's view; the encoder is the camera's sensor feed
    build: { context: ., dockerfile: world/Dockerfile }   # runs world/entrypoint.sh (renderer | ffmpeg)
    environment: [WEATHER, SCENARIO, "TWIN_PROFILE=${TWIN_PROFILE:-v11}"]   # WEATHER=night_rain docker compose up
    volumes: [logs:/logs:ro]
    ports: ["127.0.0.1:9200:9200/udp"]   # trial keypad on this host only; remote users use the dashboard
    networks: [poe_lan, sim_ctrl]
    depends_on: [camera]
    restart: unless-stopped

  calib:                       # one-shot: writes the homography to the Orin's SSD, as an installer would
    build: { context: ., dockerfile: world/Dockerfile }
    command: python3 -m tools.calibrate --out /data/calib/homography.npy
    environment: ["TWIN_PROFILE=${TWIN_PROFILE:-v11}"]
    volumes: [orin_data:/data]
    network_mode: none
    restart: "no"

  devices:                     # v11: the ESP32 laser controller on the PoE LAN (arm 7001, relays 7002)
    build: { context: ., dockerfile: devices/Dockerfile }
    command: >
      sh -c "python3 devices/arm_emulator.py --tcp 0.0.0.0:7001 --state /logs/arm.jsonl &
             python3 devices/relay_emulator.py --tcp 0.0.0.0:7002 --state /logs/relay.jsonl &
             wait"
    volumes: [logs:/logs]
    networks:
      poe_lan: { ipv4_address: 192.168.10.24 }
    restart: unless-stopped

  orin:                        # the Orin sandbox: same app, device paths and interfaces as the real box
    build: { context: ., dockerfile: orin/Dockerfile, args: { BASE: "${ORIN_BASE:-ubuntu:22.04}" } }
    cpus: 6
    mem_limit: 8g
    cap_add: [NET_ADMIN]       # lets tests shape the 4G link with tc netem
    environment: [TWIN_HORN_MONITOR=1, TZ=Asia/Singapore, "TWIN_PROFILE=${TWIN_PROFILE:-v11}"]
    volumes: [orin_data:/data, "eng_keys:/keys:ro"]   # /keys: the engineer's SSH public key (v11)
    networks:
      poe_lan: { ipv4_address: 192.168.10.2 }
      wan_4g: { ipv4_address: 172.30.4.2 }
    depends_on:
      calib: { condition: service_completed_successfully }
      devices: { condition: service_started }
      cloud: { condition: service_started }
      camera: { condition: service_started }
    restart: "no"              # a power cut is 'docker kill' + 'docker start'

  # ---- v11 remote management, emulated (design D12): no real Tailscale, every network internal
  router:                      # the 4G router: own PoE injector, Tailscale node, CGNAT on 4G
    build: { context: ., dockerfile: remote/Dockerfile }
    command: python3 router.py
    cap_add: [NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: 1 }
    environment: [TAILNET_ACL=100.64.0.10]          # the tailnet's access list: the engineer only
    networks:
      wan_4g: { ipv4_address: 172.30.4.3 }
      poe_lan: { ipv4_address: 192.168.10.1 }
      tailnet: { ipv4_address: 100.64.0.1 }
      sim_ctrl: { ipv4_address: 172.29.10.6 }        # the digital-output wire to the switch-restart relay
    depends_on: [cloud]
    restart: unless-stopped

  engineer:                    # a maintenance engineer's laptop in the tailnet
    build: { context: ., dockerfile: remote/Dockerfile }
    command: sh /remote/engineer.sh
    volumes: [eng_keys:/keys]
    networks: { tailnet: { ipv4_address: 100.64.0.10 } }
    depends_on: [router]
    restart: unless-stopped

  superior:                    # the superior: sees the cloud relay only, never the pole's LAN
    build: { context: ., dockerfile: remote/Dockerfile }
    command: sleep infinity
    networks: { wan_4g: { ipv4_address: 172.30.4.12 } }
    restart: unless-stopped

  relay:                       # the cloud relay the AI box connects out to (events and live view)
    build: { context: ., dockerfile: remote/Dockerfile }
    command: python3 relay.py
    networks: { wan_4g: { ipv4_address: 172.30.4.11 } }
    depends_on: [cloud]
    restart: unless-stopped

  cloud:                       # stands in for the cloud endpoint
    image: eclipse-mosquitto:2.0.22
    volumes: [./cloud/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]
    networks: { wan_4g: { ipv4_address: 172.30.4.10 } }
    restart: unless-stopped

  dashboard:
    build: { context: ., dockerfile: dashboard/Dockerfile }
    ports: ["${DASHBOARD_BIND:-127.0.0.1}:8080:8080"]   # loopback only: it holds the Docker socket
    environment:
      - TWIN_PROJECT=twin
      - TWIN_PROFILE=${TWIN_PROFILE:-v11}
      - CAMERA_HLS=http://172.29.10.20:8888
      - WORLD_CONTROL=world:9200
      - MQTT_BROKER=172.30.4.10
      - POLE_ID=07
      - TZ=Asia/Singapore
    volumes: [/var/run/docker.sock:/var/run/docker.sock, logs:/logs]   # docker access = fault injection
    networks:
      sim_ctrl: { ipv4_address: 172.29.10.5 }
      wan_4g: { ipv4_address: 172.30.4.20 }
    restart: unless-stopped

networks:                      # dynamic addresses come from the top half, fixed ones sit below it
  poe_lan:  { internal: true, ipam: { config: [{ subnet: 192.168.10.0/24, ip_range: 192.168.10.128/25 }] } }
  usb_bus:  { internal: true }
  wan_4g:   { internal: true, ipam: { config: [{ subnet: 172.30.4.0/24, ip_range: 172.30.4.128/25 }] } }
  sim_ctrl: { ipam: { config: [{ subnet: 172.29.10.0/24, ip_range: 172.29.10.128/25 }] } }
  tailnet:  { internal: true, ipam: { config: [{ subnet: 100.64.0.0/24, ip_range: 100.64.0.128/25 }] } }   # v11 VPN

volumes: { orin_data: {}, logs: {}, eng_keys: {} }
