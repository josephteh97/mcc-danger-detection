# Hardware list version 65 (budget pole). Same alarm thresholds as phase 1 (the guide's, verbatim);
# the gimbal and laser interlock are on the Ethernet aim controller; identification is switched off;
# detection runs on a Raspberry Pi 5 with no accelerator (full-resolution tiles, a sustained rate
# below the camera frame rate).
pole_id: "07"
site:
  pit: [[-1.2, -0.8], [1.2, -0.8], [1.2, 0.8], [-1.2, 0.8]]   # metres
camera:
  url: rtsp://192.168.10.20:8554/stream1
  homography: /data/calib/homography.npy
  size: [1920, 1080]                                           # 16:9 stream from the 8 MP C385
  lost_after_s: 3.0
  lens: { cx: 960.0, cy: 540.0, fx: 937.2, fp: 1874.4, k: 0.0 }   # C385 pinhole; barrel D not yet measured (P11)
alarm: { alarm_buffer_m: 1.5, warn_buffer_m: 3.0, dwell_s: 1.0, escalate_s: 3.0, clear_s: 2.0 }
arm: { xy: [0.0, -12.42], heading_deg: 90, pivot_h_m: 3.8, tilt_stops_deg: [5, 45] }
devices:                                                       # TCP to the Ethernet aim controller on poe_lan
  arm: 192.168.10.24:7001
  relay: 192.168.10.24:7002
  audio_sink: horn
  relay_protocol: line
detector:
  mode: oracle
  oracle_udp: "0.0.0.0:9100"
  oracle_delay_ms: 120
  oracle_miss_rate: 0.02
  miss_model: pixel_height       # miss rate from the person's height in the processed image
  tiles: true                    # full-resolution tiles over the zone region (mandatory on the Pi)
  input_px: 640                  # tile width
  native_px: [3840, 2160]
  sustained_fps: 4               # what the Pi 5 holds across the tiles (task 6b), not the 12 fps peak
identify:
  enabled: false                 # legacy: face/tag identification is not used on the budget pole
  provider: stub
uplink: { broker: 172.30.4.10, topic: pole/07/event, status_topic: pole/07/status, queue: /data/queue.db }
status_file: /data/status.json
