# Hardware list version 11. Same alarm thresholds as phase 1 (the guide's, verbatim); the
# arm and relays are on the Ethernet laser controller; identification is switched off.
pole_id: "07"
site:
  pit: [[-1.2, -0.8], [1.2, -0.8], [1.2, 0.8], [-1.2, 0.8]]   # metres
camera:
  url: rtsp://192.168.10.20:8554/stream1
  homography: /data/calib/homography.npy
  size: [1600, 1200]                                           # 4:3 stream from the 12 MP camera
  lost_after_s: 3.0
alarm: { alarm_buffer_m: 1.5, warn_buffer_m: 3.0, dwell_s: 1.0, escalate_s: 3.0, clear_s: 2.0 }
arm: { xy: [0.0, -9.5], heading_deg: 90, pivot_h_m: 1.1, tilt_stops_deg: [5, 45] }
devices:                                                       # TCP to the laser controller on poe_lan
  arm: 192.168.10.24:7001
  relay: 192.168.10.24:7002
  audio_sink: horn
  relay_protocol: line
detector:
  mode: oracle
  oracle_udp: "0.0.0.0:9100"
  oracle_delay_ms: 120
  oracle_miss_rate: 0.02
  miss_model: pixel_height       # miss rate from the person's height in the processed image
  tiles: true                    # full-resolution tiles over the zone region
  input_px: 1280                 # detector input width when tiles is false
  native_px: [4000, 3000]
identify:
  enabled: false                 # legacy: face/tag identification is not used in version 11
  provider: stub
uplink: { broker: 172.30.4.10, topic: pole/07/event, status_topic: pole/07/status, queue: /data/queue.db }
floodlight_hours: [19, 7]
status_file: /data/status.json
